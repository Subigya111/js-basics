<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM 2</title>
</head>
<body style="background-color: #212121;color:#fff">

</body>
<script>
    const div =document.createElement('div'); //creates div tag 
    console.log(div);
    div.className="main";  
    div.id=Math.random();
    div.innerText="Subigya "; //div tag content 
    const addText=document.createTextNode("chaitanya");
    div.appendChild(addText);  //same as above --> div tag content
    document.body.appendChild(div); //display div tag in webpage
</script>
</html>
