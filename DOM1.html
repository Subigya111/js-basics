<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Element in DOM</title>
</head>
<body class ="body" style="background-color:#212121;color:#fff;">
    <div class="parent">
        <div class="day">Monday</div>
        <div class="day">Tuesday</div>
        <div class="day">Wednesday</div>
        <div class="day">Thursday</div>
    </div>
</body>
<script>
    const bodyParent = document.querySelector('.parent')
    console.log(bodyParent);
    console.log(bodyParent.children);
    console.log(bodyParent.children[3].innerText);

    for(let i=0;i<bodyParent.children.length;i++){
        console.log(bodyParent.children[i].innerText);
    }
    bodyParent.children[0].style.color='orange'
    console.log(bodyParent.firstElementChild);
    console.log(bodyParent.lastElementChild);
    
    const dayone=document.querySelector('.day');
    console.log(dayone);
    console.log(dayone.parentNode);
    console.log(dayone.nextElementSibling);

    console.log("Nodes : ", bodyParent.childNodes);
</script>
</html>
